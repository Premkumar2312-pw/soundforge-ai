version: '3.8'

services:
  soundforge-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: soundforge-ai
    ports:
      - "8000:8000"
    environment:
      - APP_ENV=production
      - HOST=0.0.0.0
      - PORT=8000
      - STORAGE_BACKEND=local
      - STORAGE_DIR=/app/storage
      - DEFAULT_SAMPLE_RATE=48000
      - DEFAULT_TARGET_LOUDNESS=-14.0
      - LOG_LEVEL=INFO
    volumes:
      - ./storage:/app/storage
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s
